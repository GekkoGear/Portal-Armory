<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HQ Vehicle Linker</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1b1e23; --muted: #6a717d; --line: #e3e6ea;
    --accent: #2f6fde; --accent-text: #ffffff; --row-hover: #f0f4fb; --warn-bg: #fff3d6; --warn-text: #7a5300;
    --off: #9aa1ab;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171b; --card: #1e2127; --text: #e7e9ed; --muted: #9399a4; --line: #2d3139;
      --accent: #5b8ff0; --accent-text: #0d1117; --row-hover: #252a33; --warn-bg: #3a2f14; --warn-text: #f0c869;
      --off: #5d636d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  header { padding: 24px 24px 8px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .map { color: var(--muted); word-break: break-all; }
  main { max-width: 900px; margin: 0 auto; padding: 8px 24px 120px; }
  .hq { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin: 14px 0; overflow: hidden; }
  .hq-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .hq-head h2 { font-size: 16px; margin: 0; flex: 1 1 260px; word-break: break-word; }
  .hq-head .sub { color: var(--muted); font-size: 13px; font-weight: normal; margin-left: 6px; white-space: nowrap; }
  .mini { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 6px;
          padding: 3px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .mini:hover { border-color: var(--accent); }
  label.row { display: flex; align-items: center; gap: 12px; padding: 8px 16px; cursor: pointer; border-top: 1px solid var(--line); }
  label.row:first-of-type { border-top: 0; }
  label.row:hover { background: var(--row-hover); }
  label.row input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; cursor: pointer; }
  .type { font-weight: 600; min-width: 130px; }
  .id { color: var(--muted); font-size: 13px; word-break: break-all; flex: 1; }
  label.row.off .type, label.row.off .id { color: var(--off); text-decoration: line-through; }
  .also { background: var(--warn-bg); color: var(--warn-text); font-size: 12px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .others { color: var(--muted); font-size: 13px; margin: 18px 2px; }
  .others ul { margin: 4px 0 0; padding-left: 18px; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); }
  .bar { max-width: 900px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
  .count { flex: 1; color: var(--muted); }
  .btn { font: inherit; border-radius: 8px; padding: 9px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }
  .done { max-width: 600px; margin: 80px auto; text-align: center; padding: 0 24px; }
  .done h2 { font-size: 20px; }
  .done p { color: var(--muted); }
  @media (max-width: 560px) { .type { min-width: 0; } label.row { flex-wrap: wrap; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>HQ Vehicle Linker</h1>
    <div class="map" id="map"></div>
  </header>
  <main id="list"></main>
  <footer><div class="bar">
    <span class="count" id="count"></span>
    <button class="btn" id="cancel">Cancel</button>
    <button class="btn primary" id="add">Add checked vehicles</button>
  </div></footer>
</div>
<script>
const DATA = {{.}};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const boxes = []; // {hq, id, input, row}

document.getElementById('map').textContent = DATA.map;
const list = document.getElementById('list');
for (const hq of DATA.hqs) {
  const card = el('section', 'hq');
  const head = el('div', 'hq-head');
  const h2 = el('h2', null, hq.label);
  const sub = el('span', 'sub', hq.vehicles.length + ' new' + (hq.already ? ', ' + hq.already + ' already linked' : ''));
  h2.appendChild(sub);
  const all = el('button', 'mini', 'Check all'), none = el('button', 'mini', 'Uncheck all');
  head.append(h2, all, none);
  card.appendChild(head);
  const mine = [];
  for (const v of hq.vehicles) {
    const row = el('label', 'row');
    const input = el('input'); input.type = 'checkbox'; input.checked = true;
    row.append(input, el('span', 'type', v.type || '?'), el('span', 'id', v.id));
    if (v.also) row.appendChild(el('span', 'also', 'already on ' + v.also));
    input.addEventListener('change', update);
    card.appendChild(row);
    const b = { hq: hq.id, id: v.id, input, row };
    boxes.push(b); mine.push(b);
  }
  all.onclick = () => { mine.forEach(b => b.input.checked = true); update(); };
  none.onclick = () => { mine.forEach(b => b.input.checked = false); update(); };
  list.appendChild(card);
}
if (DATA.others && DATA.others.length) {
  const o = el('div', 'others', 'Other HQs (nothing to pick):');
  const ul = el('ul'); DATA.others.forEach(t => ul.appendChild(el('li', null, t)));
  o.appendChild(ul); list.appendChild(o);
}

function update() {
  let on = 0;
  for (const b of boxes) { b.row.classList.toggle('off', !b.input.checked); if (b.input.checked) on++; }
  document.getElementById('count').textContent = on + ' of ' + boxes.length + ' vehicles checked';
}
update();

async function send(cancel) {
  const pick = {};
  if (!cancel) for (const b of boxes) if (b.input.checked) (pick[b.hq] = pick[b.hq] || []).push(b.id);
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    const r = await fetch('submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cancel, pick }) });
    if (!r.ok) throw new Error(r.status);
    const d = el('div', 'done');
    d.append(el('h2', null, cancel ? 'Cancelled - nothing was changed.' : 'Sent!'),
             el('p', null, 'Go back to the HQ Vehicle Linker window to see the result. You can close this tab.'));
    document.getElementById('app').replaceChildren(d);
  } catch (e) {
    document.querySelectorAll('button').forEach(b => b.disabled = false);
    alert('Couldn\'t reach HQ Vehicle Linker - is its window still open?');
  }
}
document.getElementById('add').onclick = () => send(false);
document.getElementById('cancel').onclick = () => send(true);
</script>
</body>
</html>
