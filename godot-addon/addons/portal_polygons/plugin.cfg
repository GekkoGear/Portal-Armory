[plugin]

name="Portal Polygons"
description="Adds a Polygons tab that lines up the PolygonVolume points in your Battlefield 6 Portal scene. Shows a top-down before/after, lets you keep, undo or drag each change, then applies it in one undoable step. Also adds live Point Snap for dragging points in the 3D view."
author="GekkoGear"
version="3.0"
script="plugin.gd"
